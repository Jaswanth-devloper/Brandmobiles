            background-color: #ffd700;

        }

        header {
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;

<body>

    <ul>
        <li><a href="index.html">Home</a></li>

    <center>

        <header>WELCOME TO REGISTER PAGE</header>
        <img src="./images/register.png" height=" 100" width="175">
        <form action="register.py" method="post">
            <h3> NAME: <input type="text" name="name" required>
            </h3>
            <h3>EMAIL: <input type="text" name="email" required>
            </h3>
            <h3>PASSWORD: <input type="password" name="password" required>
            </h3>
            <h3>DOB: <input type="date" name="dob" required>
            </h3>
            <h3>CITY: <input type="text" name="city" required>
            </h3>
            <h3>MODEL: <select name="model" required>
                    <option value="">Select a model</option>
                    <option value="iPhone">iPhone</option>
                    <option value="Samsung">Samsung</option>
                    <option value="Google">Google Pixel</option>
                    <option value="Nothing">Nothing</option>
                    <option value="Vivo">Oppo</option>
                    <option value="Vivo">Vivo</option>
                    <option value="Realme">Realme</option>
                    <option value="Xiaomi">Xiaomi</option>
                    <option value="OnePlus">OnePlus</option>
                    <option value="Poco">Poco</option>
            </h3>
            </select>
            <br>
            <br>
            <input type="submit" value="REGISTER">
            <input type="reset" value="RESET">
        </form>
        <br>
        <br>
        <a href="signup.html">
